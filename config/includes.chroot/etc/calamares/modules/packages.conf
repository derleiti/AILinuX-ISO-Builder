backend: apt

# "remove" bricht die Installation ab, sobald ein Paket nicht auffindbar ist -
# apt liefert dann Fehlercode 100. Hier stehen deshalb nur Pakete, die auch
# wirklich in config/package-lists/ ausgeliefert werden; validate-project.sh
# prueft genau das, damit die Listen nicht wieder auseinanderlaufen.
#
# Der Schritt ist nicht kosmetisch: live-tools diversioniert
# /usr/sbin/update-initramfs auf einen No-Op. Bleibt es liegen, startet das
# installierte System weiter mit dem Live-initramfs, sucht ein Live-Medium und
# landet in der initramfs-Shell.
operations:
  - remove:
    - calamares
    - live-tools
    - live-config
    - live-config-systemd

  # Optional, je nach Bauart des Images: live-boot wurde bewusst entfernt
  # (casper uebernimmt den Live-Start), casper und lupin-casper sind nicht in
  # jeder Variante vorhanden. Ein fehlendes Paket darf hier nichts umwerfen.
  - try_remove:
    - live-boot
    - casper
    - lupin-casper
