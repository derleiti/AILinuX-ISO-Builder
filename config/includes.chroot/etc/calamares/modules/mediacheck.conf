---
# Laeuft im Live-System: geprueft wird das Medium, nicht das Ziel.
dontChroot: true
# Das squashfs wird komplett gelesen; von einem langsamen Stick dauert das
# einige Minuten.
timeout: 1800
verbose: true
script:
  - "/usr/local/sbin/ailinux-verify-live-medium"

i18n:
  name: "Live-Medium pruefen"
  name[de]: "Live-Medium pruefen"
  name[en]: "Verify the live medium"
