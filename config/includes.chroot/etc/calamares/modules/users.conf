---
# Ubuntu grants administrator privileges through the sudo group. Keep the
# policy in sudoers and make Calamares place the installed user in that group.
defaultGroups:
  - adm
  - cdrom
  - dip
  - lpadmin
  - plugdev
  - sudo
  - name: sambashare
    must_exist: false
    system: true

doAutologin: false
setRootPassword: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true

user:
  shell: /bin/bash
  forbidden_names:
    - root

passwordRequirements:
  nonempty: true
  minLength: 8
  maxLength: -1
