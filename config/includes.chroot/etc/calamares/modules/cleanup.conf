---
dontChroot: false
# Das Skript baut am Ende das initramfs neu; 30 Sekunden reichen dafuer nicht.
timeout: 900
verbose: true
script:
  - "/usr/local/sbin/ailinux-installed-cleanup ${USER}"

i18n:
  name: "Live-System-Dateien entfernen"
  name[de]: "Live-System-Dateien entfernen"
  name[en]: "Remove live-system files"
