---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 128MiB
  label: "AILINUX_EFI"

# A swap file preserves disk space on small systems and avoids the previous
# 8.4 GiB suspend-swap partition on a 25 GiB target disk.
userSwapChoices: [ file ]
initialSwapChoice: file

luksGeneration: luks1
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase

# Use GPT for automatic installs, including blank virtual disks.
defaultPartitionTableType: gpt

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

directoryFilesystemRestrictions:
  - directory: "any"
    allowedFilesystemTypes: [ "all" ]
  - directory: "/"
    allowedFilesystemTypes: [ "ext4", "btrfs", "xfs" ]
  - directory: "/boot"
    allowedFilesystemTypes: [ "ext2", "ext3", "ext4", "btrfs", "xfs" ]
    onlyWhenMountpoint: true
  - directory: "efi"
    allowedFilesystemTypes: [ "fat32" ]
    onlyWhenMountpoint: true

essentialMounts: [ "live-*", "control", "ventoy" ]
enableLuksAutomatedPartitioning: true

lvm:
  enable: true

# Calamares automatically prepends an ESP on UEFI systems. Automatic installs
# use GPT on blank disks; manual partitioning remains available.
partitionLayout:
  - name: "AILINUX_ROOT"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
    minSize: 12G

requiredStorage: 16
