---
# Laeuft im Live-System, nicht im Ziel-chroot: das Live-Medium unter /cdrom
# wird als Referenz gebraucht, und zu diesem Zeitpunkt ist im Ziel ausser dem
# entpackten Dateibaum noch nichts nutzbar.
dontChroot: true
timeout: 600
verbose: true
script:
  - "/usr/local/sbin/ailinux-verify-target-kernel ${ROOT}"

i18n:
  name: "Kernel im Zielsystem pruefen"
  name[de]: "Kernel im Zielsystem pruefen"
  name[en]: "Verify the target system kernel"
